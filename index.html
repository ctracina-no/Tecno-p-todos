<!-- Quando for usar o compilamento do tailwindcss, estão na mesma pasta -->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="src/output.css">

    <title>Tecnologia para todos</title>
</head>

<!-- Criação do modo Dark do site -->

<body class="bg-gray-200 text-gray-900  dark:bg-gray-900 dark:text-gray-100">

    <!-- Divisão do gradiente do modo claro e escuro -->
    <header class="bg-linear-to-r from-[#ffffff] from-21% via-[#78d8f0] via-78% to-tpt-azul to-100% border-b border-tpt-azul
        dark:from-gray-900 dark:from-21% dark:via-tpt-azulescuro dark:via-65% dark:to-tpt-azul dark:to-100%">

        <div class="max-w-285 mx-auto px-6 flex justify-between items-center gap-4 py-4.5">

            <!-- Div 1 = para separar o icone e o titulo -->
            <div class="flex items-center gap-4">

                <a type="button" href="index.html"
                    class="w-13.5 h-13.5 rounded-xl bg-tpt-azul flex items-center justify-center text-white font-extrabold text-[1.05rem] tracking-wide shrink-0">
                    <img src="Img/globe-hemisphere-west-light.png" alt="LogodoSite">
                </a>

                <div>
                    <h1 class="m-0 text-lg font-extrabold">
                        Tecnologia para todos
                    </h1>

                    <p class="mt-0.5 mb-0 text-sm">
                        Um site acessível para todos seus usuários
                    </p>
                </div>
            </div>

            <!-- Div 2 = para separar o botão de modos e ainda falta o botão de "edição avançada" -->
            <div>
                <button id="modos" type="button" aria-label="Ativar modo escuro" aria-pressed="false"
                    class="rounded-full border border-white/50 p-2">
                    <img id="icone-tema" src="Img/sun.png" alt="Modo claro" class="h-6 w-6">
                </button>
            </div>

        </div>

    </header>

    <!-- Script da mudança dos modos e no salvamento da preferencia -->
    <script src="JS/modos.js"></script>

</html >
