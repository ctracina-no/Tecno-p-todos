<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal com Tailwind CSS</title>
    <!-- CORRIGIDO: Agora apontando para a CDN oficial correta do Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- Botão Principal -->
    <button id="abrirModal" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg shadow-md transition-colors duration-200">
        Ver Informações
    </button>

    <!-- Estrutura do Modal (Escondido por padrão com a classe 'hidden') -->
    <div id="janelaModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        
        <!-- Caixa de Conteúdo -->
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative transform transition-all scale-95 opacity-0 duration-300" id="conteudoModal">
            
            <!-- Botão de Fechar (X) - CORRIGIDO: Removido erro de digitação na classe -->
            <button id="fecharModal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl font-semibold outline-none">
                &times;
            </button>

            <!-- Título e Texto -->
            <h3 class="text-xl font-bold text-gray-900 mb-2">Informações Importantes</h3>
            <p class="text-gray-600 mb-4">
                Este é o conteúdo que aparece de forma dinâmica dentro do seu próprio site utilizando as classes do Tailwind CSS!
            </p>
            
            <!-- Botão de Ação Opcional dentro do Modal -->
            <div class="flex justify-end">
                <button id="fecharModalBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded-lg transition-colors">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <!-- Script de Controle -->
    <script>
        const btnAbrir = document.getElementById('abrirModal');
        const btnFecharX = document.getElementById('fecharModal');
        const btnFecharBtn = document.getElementById('fecharModalBtn');
        const modal = document.getElementById('janelaModal');
        const conteudo = document.getElementById('conteudoModal');

        // Função para abrir o modal com efeito suave
        function abrir() {
            modal.classList.remove('hidden');
            // Pequeno delay para a animação do Tailwind funcionar
            setTimeout(() => {
                conteudo.classList.remove('scale-95', 'opacity-0');
                conteudo.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        // Função para fechar o modal com efeito suave
        function fechar() {
            conteudo.classList.remove('scale-100', 'opacity-100');
            conteudo.classList.add('scale-95', 'opacity-0');
            // Espera a animação terminar antes de esconder de fato
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        btnAbrir.addEventListener('click', abrir);
        btnFecharX.addEventListener('click', fechar);
        btnFecharBtn.addEventListener('click', fechar);

        // Fecha se clicar no fundo escuro
        window.addEventListener('click', (e) => {
            if (e.target === modal) fechar();
        });
    </script>

</body>
</html>
